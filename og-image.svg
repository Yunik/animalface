<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f9ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Card -->
  <rect x="100" y="80" width="1000" height="470" rx="30" fill="url(#cardGradient)" opacity="0.95"/>

  <!-- Title -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#333" text-anchor="middle">직장인 유형 테스트</text>

  <!-- Subtitle -->
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="28" fill="#666" text-anchor="middle">AI가 분석하는 당신의 회사 동물 유형</text>

  <!-- Animal Emojis Row -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="64" text-anchor="middle">🦅 🦁 🐼 🐿️ 🐨 👀 🦴 🕊️</text>

  <!-- Description -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="24" fill="#555" text-anchor="middle">사진 한 장으로 알아보는 8가지 직장인 동물 유형!</text>

  <!-- CTA -->
  <rect x="450" y="470" width="300" height="55" rx="27" fill="url(#bgGradient)"/>
  <text x="600" y="507" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">무료로 테스트하기</text>
</svg>
